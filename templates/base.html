{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ai Resume Analyser</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %} ?v=15" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">The Editorial Analyst</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarText"
          aria-controls="navbarText"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/'%} active {% endif %}"
                aria-current="page"
                href="{% url 'home' %}"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link {% if request.path == '/history/'%} active {% endif %}"
                href="{% url 'history' %}"
                >History</a
              >
            </li>
          </ul>
          <div class="profile-div">
            <button class="pro-btn">Pro</button>
            <button class="upload-resume" onclick="openFileInput()">
              Upload Resume
            </button>
            <div class="profile-img">
              <img
                class="profile-pic"
                src="{% static 'img/profile-pic.jpg' %}"
                alt="profile-img"
              />
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container">
      {% block content %} 
      
      {% endblock content %}
    </div>

    <footer class="footer">
      <p>Copyright &copy; 2026</p>
    </footer>
    <script>
      function openFileInput() {
        document.getElementById("fileInput").click();
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
  </body>
</html>
